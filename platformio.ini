; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; 无线口令不写入仓库，构建前由环境变量注入：
;   macOS / Linux:  export BUMP_WIFI_SSID=... BUMP_WIFI_PASS=...
;   Windows:        $env:BUMP_WIFI_SSID='...'; $env:BUMP_WIFI_PASS='...'
; 未设置时宏为空字符串，普通编译不受影响，但联网测试会失败。

[env]
; 串口日志统一 115200，并给每行加时间戳，便于两块板对照调试。
monitor_speed = 115200
monitor_filters = time, default

; ---------------------------------------------------------------------------
; 偶遇徽章 MVP（默认固件）
; ---------------------------------------------------------------------------
; 两块同型号 Nano RP2040 Connect 刷同一份固件即可互相扫描。
; 两板同时接在电脑上时，用 --upload-port 指定目标板，避免烧错：
;   pio run -e nanorp2040connect -t upload --upload-port /dev/cu.usbmodemXXXX
;   pio device monitor -p /dev/cu.usbmodemXXXX
;
; 前置条件：NINA-W102 固件需 >= 3.0.1（ArduinoBLE 广播/扫描依赖新版固件）。
; 用 Arduino IDE 的 WiFiNINA 固件更新器升级，否则 BLE.begin() 会失败。
[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
lib_deps = arduino-libraries/ArduinoBLE@^2.1.0
build_src_filter = +<*> -<wifi_test.cpp> -<device_identity.cpp>

; ---------------------------------------------------------------------------
; 双板连接自检（烧录不同的两版固件）
; ---------------------------------------------------------------------------
; nano_a：BLE 外设，可连接广播，暴露服务 a5b0 / 特征 a5b1。
; nano_b：BLE 中心，扫描 a5b0 → 连接 → 读取 a5b1 → 断开，每 5s 重试。
;
;   pio run -e nano_a -t upload --upload-port <A 的串口>
;   pio run -e nano_b -t upload --upload-port <B 的串口>
;   pio device monitor -e nano_a
;   pio device monitor -e nano_b
;
; 看到 [test] ... RESULT=PASS 即说明两块板之间的 BLE 建连、服务发现、
; 特征读取全链路正常。
[env:nano_a]
extends = env:nanorp2040connect
build_flags =
  -D BUMP_TEST_ROLE=1
  -D BUMP_DEVICE_LABEL=\"A\"

[env:nano_b]
extends = env:nanorp2040connect
build_flags =
  -D BUMP_TEST_ROLE=2
  -D BUMP_DEVICE_LABEL=\"B\"

; ---------------------------------------------------------------------------
; WiFi 连接自检
; ---------------------------------------------------------------------------
; 仅验证 NINA-W102 的 WiFi 连接。注意 WiFi 与 BLE 共用 NINA 模块，不能同时
; 使用；账号密码通过 build_flags 注入，正式接入前应改为本地 secrets 配置。
;
;   pio run -e wifi_test -t upload --upload-port /dev/cu.usbmodemXXXX
;   pio device monitor -p /dev/cu.usbmodemXXXX
[env:wifi_test]
extends = env:nanorp2040connect
lib_deps = arduino-libraries/WiFiNINA@^1.8.13
build_src_filter = +<*> -<conn_test.cpp>
build_flags =
  -D BUMP_WIFI_TEST=1
  -D WIFI_SSID=\"${sysenv.BUMP_WIFI_SSID}\"
  -D WIFI_PASS=\"${sysenv.BUMP_WIFI_PASS}\"

; ---------------------------------------------------------------------------
; 偶遇 MVP + MQTT 上报
; ---------------------------------------------------------------------------
; WiFi 与 BLE 共用 NINA 模块，固件采用分时上传（见 docs/FIRMWARE_MQTT_PLAN.md）。
; 账号密码暂由 build_flags 注入，正式使用前改为本地 secrets 配置。
; 当前指向 HiveMQ 公用测试 broker（匿名、无隔离，仅课程演示/联调用）。
; 实测 NINA 3.0.2 的根证书库校验不了 test.mosquitto.org（自签 CA）和
; broker.emqx.io（RapidSSL 链）；HiveMQ 的 Amazon 根证书可通过。
; 正式部署改为自己的服务器 + Let's Encrypt + 每设备凭证。
;
;   pio run -e mqtt -t upload --upload-port /dev/cu.usbmodemXXXX
[env:mqtt]
extends = env:nanorp2040connect
lib_deps =
  arduino-libraries/ArduinoBLE@^2.1.0
  ; 必须用 2.x：1.9.x 自带 spi_drv.cpp，与 ArduinoBLE 依赖的 Arduino_SpiNINA
  ; 符号重复导致链接失败；2.x 已把 SPI 驱动外置为同一份实现。
  arduino-libraries/WiFiNINA@^2.0.0
  arduino-libraries/ArduinoMqttClient@^0.1.8
build_src_filter = +<*> -<wifi_test.cpp>
build_flags =
  -D BUMP_MQTT=1
  -D BUMP_FW_VERSION=\"0.4.0\"
  -D BUMP_WIFI_SSID=\"${sysenv.BUMP_WIFI_SSID}\"
  -D BUMP_WIFI_PASS=\"${sysenv.BUMP_WIFI_PASS}\"
  -D BUMP_MQTT_HOST=\"broker.hivemq.com\"
  -D BUMP_MQTT_PORT=8883
  -D BUMP_MQTT_PASS=\"\"
