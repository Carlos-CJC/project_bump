; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; 串口日志统一 115200，并给每行加时间戳，便于两块板对照调试。
monitor_speed = 115200
monitor_filters = time, default

; ---------------------------------------------------------------------------
; 偶遇徽章 MVP（默认固件）
; ---------------------------------------------------------------------------
; 两块同型号 Nano RP2040 Connect 刷同一份固件即可互相扫描。
; 两板同时接在电脑上时，用 --upload-port 指定目标板，避免烧错：
;   pio run -e nanorp2040connect -t upload --upload-port /dev/cu.usbmodemXXXX
;   pio device monitor -p /dev/cu.usbmodemXXXX
;
; 前置条件：NINA-W102 固件需 >= 3.0.1（ArduinoBLE 广播/扫描依赖新版固件）。
; 用 Arduino IDE 的 WiFiNINA 固件更新器升级，否则 BLE.begin() 会失败。
[env:nanorp2040connect]
platform = raspberrypi
board = nanorp2040connect
framework = arduino
lib_deps = arduino-libraries/ArduinoBLE@^2.1.0

; ---------------------------------------------------------------------------
; 双板连接自检（烧录不同的两版固件）
; ---------------------------------------------------------------------------
; nano_a：BLE 外设，可连接广播，暴露服务 a5b0 / 特征 a5b1。
; nano_b：BLE 中心，扫描 a5b0 → 连接 → 读取 a5b1 → 断开，每 5s 重试。
;
;   pio run -e nano_a -t upload --upload-port <A 的串口>
;   pio run -e nano_b -t upload --upload-port <B 的串口>
;   pio device monitor -e nano_a
;   pio device monitor -e nano_b
;
; 看到 [test] ... RESULT=PASS 即说明两块板之间的 BLE 建连、服务发现、
; 特征读取全链路正常。
[env:nano_a]
extends = env:nanorp2040connect
build_flags =
  -D BUMP_TEST_ROLE=1
  -D BUMP_DEVICE_LABEL=\"A\"

[env:nano_b]
extends = env:nanorp2040connect
build_flags =
  -D BUMP_TEST_ROLE=2
  -D BUMP_DEVICE_LABEL=\"B\"
