<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 224" fill="none" role="img" aria-labelledby="t d">
  <title id="t">两枚智能社交挂件的蓝牙发现示意图</title>
  <desc id="d">两枚不同颜色的挂件之间有三道无线电弧线，表示模拟蓝牙发现，不显示任何实物连接状态。</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a8d6b1" opacity=".29"/></pattern>
    <linearGradient id="mint" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#dfffca"/><stop offset="1" stop-color="#87cbb3"/></linearGradient>
    <linearGradient id="gold" x2=".85" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#ffe9a6"/><stop offset="1" stop-color="#e5b959"/></linearGradient>
    <g id="board">
      <rect x="-31" y="-49" width="64" height="99" rx="17" fill="#122d29" fill-opacity=".13" stroke="currentColor" stroke-width="1.2"/>
      <path d="M-22 2h12l7-8h17M8-17v6l7 6h9M-22 11h9l9 9h26M-19 29h10M17 28h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      <rect x="-13" y="-15" width="21" height="20" rx="4" fill="currentColor"/><path d="M-8-19v4m5-4v4m5-4v4M-8 5v4m5-4v4m5-4v4" stroke="currentColor"/>
      <circle cx="-20" cy="-29" r="2.4" fill="currentColor"/><circle cx="22" cy="35" r="1.8" fill="currentColor"/><circle cx="22" cy="29" r="1.8" fill="currentColor"/>
    </g>
  </defs>
  <rect x="0" y="0" width="580" height="224" fill="url(#dots)"/>
  <path d="M25 123h530" stroke="#c8efc3" stroke-opacity=".25" stroke-dasharray="3 7"/>
  <g stroke="#b8deb9" stroke-opacity=".22">
    <circle cx="173" cy="119" r="79" stroke-dasharray="2 5"/><circle cx="173" cy="119" r="96" stroke-dasharray="67 12 2 10"/>
    <circle cx="402" cy="107" r="73" stroke-dasharray="2 5"/><circle cx="402" cy="107" r="90" stroke-dasharray="54 12 2 10"/>
  </g>
  <g transform="translate(169 119) rotate(-17)">
    <path d="M-5-66c-12-15-17-35-8-39 9-3 17 18 14 39" stroke="#b0ddba" stroke-width="3"/>
    <rect x="-42" y="-61" width="87" height="128" rx="22" fill="#35695c" stroke="#9dc8a7"/>
    <rect x="-44" y="-65" width="87" height="128" rx="22" fill="url(#mint)" stroke="#d8f6c8" stroke-width="1.5"/>
    <rect x="-12" y="-58" width="23" height="5" rx="2.5" fill="#205046"/><use href="#board" color="#2b6557"/>
    <text x="-22" y="43" fill="#254f47" font-family="monospace" font-size="8" letter-spacing="1.5">NODE A</text>
  </g>
  <g transform="translate(403 108) rotate(15)">
    <path d="M-5-62c-8-15-14-32-6-36 8-4 13 17 12 37" stroke="#e7d29a" stroke-width="3"/>
    <rect x="-40" y="-58" width="82" height="121" rx="21" fill="#93783d" stroke="#cfbb7a"/>
    <rect x="-42" y="-62" width="82" height="121" rx="21" fill="url(#gold)" stroke="#fee49a" stroke-width="1.5"/>
    <rect x="-12" y="-56" width="22" height="5" rx="2.5" fill="#594c2f"/><g transform="scale(.94)"><use href="#board" color="#675a35"/></g>
    <text x="-21" y="41" fill="#5c5134" font-family="monospace" font-size="8" letter-spacing="1.5">NODE B</text>
  </g>
  <g stroke="#d4f5c2" stroke-linecap="round" stroke-width="2.6">
    <path d="M271 99a29 29 0 0 1 0 32" opacity=".53"/><path d="M281 93a40 40 0 0 1 0 44" opacity=".76"/><path d="M291 87a51 51 0 0 1 0 56"/>
